[project]
name = "zomato-success-api"
version = "0.1.0"
description = "Predicts if a restaurant will succeed (get a rating of 3.75 or higher) by looking at things like location, cuisine type, pricing, and whether they offer online ordering."
readme = "README.md"
authors = [
    { name = "Ahmed Al-Shobaki", email = "ahmedelshobakey711@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.5",
  "pydantic>=2.12.5",
  "numpy>=2.3.5",
  "pandas>=2.4.1",
  "scikit-learn>=1.8.0",
  "xgboost>=3.0.0",
  "joblib>=1.5.1",
  "python-dotenv>=1.2.1"
]
[project-optional-dependencies]
cache = ["redis>=5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>0.27"]

[tool.pytest.ini_options]
addopts = "-v --cov=src"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
