[project]
name = "zomato-success-api"
version = "0.1.0"
description = "Predicts if a restaurant will succeed (get a rating of 3.75 or higher) by looking at things like location, cuisine type, pricing, and whether they offer online ordering."
readme = "README.md"
authors = [
    { name = "Ahmed Al-Shobaki", email = "ahmedelshobakey711@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "joblib>=1.3",
    "structlog>=24.1",
    "skl2onnx>=1.20.0",
    "onnxruntime>=1.24.3",
    "lightgbm>=4.7.0",
    "onnxmltools>=1.16.0",
    "streamlit>=1.62.0",
    "requests>=2.34.2",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.4", "black>=24.0"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-fail-under=70 --cov-report=term-missing --cov-config=pyproject.toml"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["src/app.py", "src/train.py"]

[tool.coverage.report]
omit = ["src/app.py", "src/train.py"]
