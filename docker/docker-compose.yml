version: "3.9"

services:
  zomato-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: zomato-success-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models:ro
    environment:
      - API_KEY=${API_KEY:-supersecretkey}
      - MODEL_PATH=${MODEL_PATH:-/app/models/restaurant_model.onnx}
      - ARTIFACTS_DIR=${ARTIFACTS_DIR:-/app/models}
      - MODEL_VERSION=${MODEL_VERSION:-0.2.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
